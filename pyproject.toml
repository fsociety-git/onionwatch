[project]
name = "onionwatch"
version = "0.1.0"
description = "Self-hosted Tor dark-web monitor: discovers .onion sites, detects phishing clones, and hunts your identifiers in leaks and marketplace listings"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Aman Sonkamble"}]
requires-python = ">=3.12"
keywords = ["tor", "dark-web", "threat-intelligence", "osint", "security", "crawler"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/fsociety-git/onionwatch"

[project.scripts]
onionwatch = "onionwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
