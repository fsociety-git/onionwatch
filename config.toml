socks_proxy       = "socks5://tor:9050"
tor_control_port  = 9051
max_depth         = 0
max_urls          = 50000
time_budget_min   = 120
per_host_page_cap = 500
concurrency       = 8
per_host_delay    = 2.0
request_timeout   = 60.0
max_retries       = 3
user_agent        = "dwcollector/0.1"
ahmia_enabled     = true
snippet_chars     = 500
simhash_distance  = 3

# --- alerting (Tier 1) ---
watchlist_terms = "terms.txt"
alerts_path     = "data/alerts.jsonl"
alert_webhook   = ""            # optional outbound POST target; "" disables
